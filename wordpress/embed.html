<!--
  WordPress の固定ページに「カスタムHTML」ブロックを追加して、以下をまるごと貼り付けてください。
  アプリ本体は同じサーバーの /tadoku-app/ に置きます（ConoHa WING のファイルマネージャーでアップロード）。
-->
<div id="tadoku-wrap" style="max-width:760px;margin:0 auto;">
  <iframe
    id="tadoku-frame"
    src="https://www.ouchieigo-club.com/tadoku-app/"
    title="多読きろく帳"
    loading="lazy"
    allow="camera; web-share; clipboard-write"
    style="width:100%;height:1600px;border:0;display:block;border-radius:16px;"></iframe>
</div>
<script>
  // アプリの高さに合わせて iframe を自動で伸び縮みさせる
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'tadoku-height') return;
    if (e.origin !== new URL(document.getElementById('tadoku-frame').src).origin) return;
    document.getElementById('tadoku-frame').style.height = (e.data.height + 20) + 'px';
  });
</script>
