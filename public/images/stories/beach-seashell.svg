<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="beachSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4EA8DE"/>
      <stop offset="50%" stop-color="#90E0EF"/>
      <stop offset="100%" stop-color="#CAF0F8"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#90E0EF"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE3A8"/>
      <stop offset="100%" stop-color="#F3C68F"/>
    </linearGradient>
    <linearGradient id="starShellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="50%" stop-color="#FFB6C1"/>
      <stop offset="100%" stop-color="#FF69B4"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#beachSky)"/>

  <!-- Bright Summer Sun -->
  <circle cx="680" cy="90" r="50" fill="#FFD166"/>
  <circle cx="680" cy="90" r="65" fill="#FFD166" opacity="0.3"/>

  <!-- Seagulls -->
  <path d="M 150,100 Q 165,85 180,100 Q 195,85 210,100" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 230,120 Q 240,110 250,120 Q 260,110 270,120" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Ocean Waves -->
  <path d="M 0,180 C 200,170 400,190 800,170 L 800,320 L 0,320 Z" fill="url(#oceanGrad)"/>
  <path d="M 0,220 C 250,210 500,230 800,215 L 800,320 L 0,320 Z" fill="#48CAE4" opacity="0.7"/>

  <!-- White Seafoam Wave Edge -->
  <path d="M 0,250 Q 50,240 100,255 T 200,250 T 300,260 T 400,250 T 500,260 T 600,250 T 700,260 T 800,250 L 800,280 C 500,290 200,270 0,285 Z" fill="#FFFFFF" opacity="0.8"/>

  <!-- Sandy Beach Horizon -->
  <path d="M 0,260 Q 350,240 800,270 L 800,500 L 0,500 Z" fill="url(#sandGrad)"/>

  <!-- Sparkles on Sand -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="120" cy="380" r="3"/>
    <circle cx="280" cy="450" r="2"/>
    <circle cx="450" cy="360" r="3"/>
    <circle cx="620" cy="420" r="2.5"/>
    <circle cx="700" cy="350" r="3"/>
  </g>

  <!-- Star-shaped White/Pink Seashell (Glowing Magic finding!) -->
  <g id="star-seashell" transform="translate(480, 370)">
    <!-- Magic sparkles around shell -->
    <path d="M -20,-10 L -15,-5 L -20,0 L -25,-5 Z" fill="#FFD166"/>
    <path d="M 30,-20 L 33,-15 L 30,-10 L 27,-15 Z" fill="#FFD166"/>
    <path d="M 25,30 L 28,34 L 25,38 L 22,34 Z" fill="#FFD166"/>

    <!-- Shell Glow -->
    <circle cx="0" cy="0" r="38" fill="#FFF" opacity="0.5"/>

    <!-- Star Shell Body -->
    <path d="M 0,-30 L 8,-10 L 28,-8 L 13,6 L 18,26 L 0,15 L -18,26 L -13,6 L -28,-8 L -8,-10 Z" fill="url(#starShellGrad)" stroke="#FFB6C1" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Other small seashells on beach -->
  <path d="M 580,410 Q 590,395 600,410 Z" fill="#F4A261" stroke="#E76F51" stroke-width="2"/>
  <path d="M 220,390 Q 230,380 240,390 Z" fill="#E76F51"/>

  <!-- Hanako Girl Bending Down Joyfully Looking at Shell -->
  <g id="hanako-girl" transform="translate(260, 180)">
    <!-- Shadow -->
    <ellipse cx="70" cy="270" rx="60" ry="18" fill="#D4A373" opacity="0.5"/>

    <!-- Legs & Sandals -->
    <rect x="45" y="210" width="14" height="50" fill="#FFD97D" rx="5"/>
    <rect x="75" y="210" width="14" height="50" fill="#FFD97D" rx="5"/>
    <!-- Pink Straw Sandals -->
    <ellipse cx="48" cy="258" rx="14" ry="6" fill="#FF8FA3"/>
    <ellipse cx="78" cy="258" rx="14" ry="6" fill="#FF8FA3"/>

    <!-- One-piece Summer Dress (Pink Polka Dot) -->
    <path d="M 35,110 L 85,110 L 105,210 Q 60,220 15,210 Z" fill="#FF758F"/>
    <!-- White Polka Dots -->
    <circle cx="45" cy="140" r="4" fill="#FFF"/>
    <circle cx="75" cy="145" r="4" fill="#FFF"/>
    <circle cx="35" cy="175" r="4" fill="#FFF"/>
    <circle cx="65" cy="180" r="4" fill="#FFF"/>
    <circle cx="90" cy="170" r="4" fill="#FFF"/>

    <!-- Arms Reaching towards seashell -->
    <path d="M 80,120 Q 130,140 160,165 Q 150,175 110,140 Z" fill="#FFD97D"/>

    <!-- Head & Straw Hat -->
    <g transform="translate(30, 30)">
      <!-- Pigtails Hair -->
      <path d="M -10,50 Q -30,70 -20,85 Q -5,80 5,60 Z" fill="#5E3023"/>
      <path d="M 70,50 Q 90,70 80,85 Q 65,80 55,60 Z" fill="#5E3023"/>

      <!-- Face -->
      <circle cx="30" cy="50" r="30" fill="#FFD97D"/>

      <!-- Happy Excited Face -->
      <circle cx="20" cy="52" r="4.5" fill="#3A1500"/>
      <circle cx="42" cy="52" r="4.5" fill="#3A1500"/>
      <circle cx="21" cy="50" r="1.5" fill="#FFF"/>
      <circle cx="43" cy="50" r="1.5" fill="#FFF"/>

      <!-- Big Open Happy Smile -->
      <path d="M 22,62 Q 31,74 40,62 Z" fill="#E63946"/>

      <!-- Rosy Cheeks -->
      <ellipse cx="12" cy="58" rx="6" ry="4" fill="#FF758F" opacity="0.7"/>
      <ellipse cx="50" cy="58" rx="6" ry="4" fill="#FF758F" opacity="0.7"/>

      <!-- Wide Straw Sunhat -->
      <ellipse cx="30" cy="22" rx="65" ry="18" fill="#E9C46A"/>
      <path d="M -5,22 C -5,-15 65,-15 65,22 Z" fill="#F4A261"/>
      <path d="M -3,22 Q 30,12 63,22" stroke="#E63946" stroke-width="5" fill="none"/> <!-- Red Ribbon -->
    </g>
  </g>
</svg>
